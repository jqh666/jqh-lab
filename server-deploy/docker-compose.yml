services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jqh-backend
    restart: always
    expose:
      - "8080"
    environment:
      TZ: Asia/Shanghai
    networks:
      - jqh-lab

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jqh-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - jqh-lab

networks:
  jqh-lab:
    driver: bridge
